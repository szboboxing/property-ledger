services:
  db:
    image: postgres:17-alpine
    container_name: propertyledger-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: property
      POSTGRES_PASSWORD: ${DB_PASSWORD:-property}
      POSTGRES_DB: propertyledger
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:5432:5432"   # 仅本机可访问，便于宿主机开发调试
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U property -d propertyledger"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - internal

  web:
    image: ghcr.io/szboboxing/property-ledger:latest
    container_name: propertyledger-web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__Default: Host=db;Port=5432;Database=propertyledger;Username=property;Password=${DB_PASSWORD:-property}
      TZ: Asia/Shanghai
    ports:
      - "${WEB_PORT:-8080}:8080"
    volumes:
      - uploads:/app/uploads   # 富文本备注图片持久化
      # 在线升级（v1.9+）：应用通过 docker.sock 创建一次性升级容器，自动 pull 新镜像并重建本容器；
      # 不挂载 sock 时应用内一键升级不可用（设置页会显示手动命令），按需移除本行
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - internal

volumes:
  pgdata:
  uploads:

networks:
  internal:
